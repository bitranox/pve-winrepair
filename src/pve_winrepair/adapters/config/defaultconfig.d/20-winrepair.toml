# ==============================================================================
# pve-winrepair - node CLI settings
# ==============================================================================
#
# Put the values for your site in the app layer, /etc/pve-winrepair/config.toml on the
# Proxmox node (precedence and the other layers: see defaultconfig.toml). An unknown key
# or a refused value stops every command that reads these settings, naming
# <section>.<key>.
#
# Environment Variable format: PVE_WINREPAIR___<SECTION>__<KEY>=<VALUE>, for example
#   PVE_WINREPAIR___SSH__KEY=/root/.ssh/id_guest
# overrides [ssh] key for one run.
#
# An empty text value means "not configured": it loads, and the command that needs it
# refuses to run until it is set.
#
# A Windows path goes in single quotes, 'C:\Users\op\.ssh\id_pve_node', or with every
# backslash doubled: in double quotes "\U" does not load and "\t" becomes a tab.

[ssh]

# Purpose: Private key file the node uses to log in to the guest over ssh
# Type: string (path); required by the commands that reach a guest
# Default: "" (not configured)
# Environment Variable: PVE_WINREPAIR___SSH__KEY=/root/.ssh/id_guest
key = ""

# Purpose: Account the node logs in as on the guest
# Type: string; letters, digits and _ . - only, 1 to 64 characters (no DOMAIN\ part)
# Default: "Administrator"
# Environment Variable: PVE_WINREPAIR___SSH__USER=admin
user = "Administrator"

# Purpose: Whether ssh refuses a guest whose host key is unknown or has changed
# Type: boolean; true passes StrictHostKeyChecking=yes to ssh, false passes no
# Default: true
# Environment Variable: PVE_WINREPAIR___SSH__STRICT_HOST_KEY_CHECKING=false
# Note: a guest rebuilt from a template gets a new host key; set false only for guests
#       on a network you trust
strict_host_key_checking = true

# Purpose: known_hosts file ssh reads and writes for the guests
# Type: string (path); a leading ~ is passed to ssh as written, and ssh expands it;
#       empty, whitespace and " are refused (ssh would misread them), % tokens are ssh's
# Default: "~/.ssh/known_hosts"
# Environment Variable: PVE_WINREPAIR___SSH__KNOWN_HOSTS_FILE=~/.ssh/known_hosts_guests
known_hosts_file = "~/.ssh/known_hosts"

[guest]

# Purpose: The LAN the guest's address must be in
# Type: string; an IPv4 network in CIDR or netmask form with no host bits set
#       (192.0.2.0/24 or 192.0.2.0/255.255.255.0), or "" (empty)
# Default: "" - the guest's only non-loopback, non-link-local IPv4 address is used, and
#       a guest with several such addresses is refused
# Environment Variable: PVE_WINREPAIR___GUEST__SUBNET=192.0.2.0/24
subnet = ""

# Purpose: Boot tasks that start the guest's CI runners
# Type: array of strings; letters, digits and _ . - only, 1 to 64 characters each
# Default: [] (no task check)
# Environment Variable: PVE_WINREPAIR___GUEST__RUNNER_TASKS='["runner-a","runner-b"]'
# Note: no node command reads this value. It records what an operator passes to the guest
#       tool as `verify-runners --task NAME` (one --task per entry); `pve-winrepair config`
#       shows it.
runner_tasks = []

# Purpose: Number of running runner containers that means the runners are healthy
# Type: integer, 0 to 999999 (true/false is refused)
# Default: 0 (any readable count is OK)
# Environment Variable: PVE_WINREPAIR___GUEST__EXPECTED_RUNNERS=4
# Note: no node command reads this value. It records what an operator passes to the guest
#       tool as `verify-runners --expected N`; `pve-winrepair config` shows it.
expected_runners = 0

[repair]

# Purpose: Directory on the node that holds the Windows installation media, unpacked as on
#          the ISO (not the ISO file): setup.exe and sources\install.wim at its top level.
#          `repair` copies everything in it to the guest's stage root.
# Type: string (path); required by `repair`
# Default: "" (not configured)
# Environment Variable: PVE_WINREPAIR___REPAIR__MEDIA_DIR=/srv/media
# Note: read when media_source = "node"
media_dir = ""

# Purpose: Where a repair takes the installation media from: "node" is media_dir on the
#          node, "local" is local_media_dir on the machine running the tool
# Type: string; "node" or "local" (lower case)
# Default: "node"
# Environment Variable: PVE_WINREPAIR___REPAIR__MEDIA_SOURCE=local
# Note: with no [node] host the node is the machine running the tool, so both name a
#       directory on the same machine. With a remote node, "node" needs the guest key
#       ([ssh] key) in this machine's ssh-agent and agent forwarding allowed on the node
media_source = "node"

# Purpose: This machine's copy of the installation media, laid out like media_dir
#          (setup.exe and sources\install.wim at its top level)
# Type: string (path on the machine running the tool); required with media_source = "local"
# Default: "" (not configured)
# Environment Variable: PVE_WINREPAIR___REPAIR__LOCAL_MEDIA_DIR=/home/op/winmedia/win11
local_media_dir = ""

# Purpose: How long copying the media to the guest may take, in minutes
# Type: integer, 1 to 1440 (true/false is refused)
# Default: 90
# Environment Variable: PVE_WINREPAIR___REPAIR__STAGE_TIMEOUT_MINUTES=180
# Note: a slow link from a workstation to the guest may need more
stage_timeout_minutes = 90

# Purpose: Name of the Proxmox snapshot taken before a repair
# Type: string; a letter first, then letters, digits, _ and -, 2 to 40 characters
# Default: "pre_winrepair"
# Environment Variable: PVE_WINREPAIR___REPAIR__SNAPSHOT_NAME=pre_repair
snapshot_name = "pre_winrepair"

# Purpose: Free space (GiB, 1024^3 bytes) the drive the media are staged to must have
#          (the media copy); when C: is the only usable drive it needs this plus
#          system_free_gb
# Type: float, greater than 0 (true/false is refused)
# Default: 15.0
# Environment Variable: PVE_WINREPAIR___REPAIR__STAGE_FREE_GB=15.0
stage_free_gb = 15.0

# Purpose: Free space (GiB) C: must have before a repair starts: the in-place upgrade's
#          own working set and rollback copy
# Type: float, greater than 0 (true/false is refused)
# Default: 25.0
# Environment Variable: PVE_WINREPAIR___REPAIR__SYSTEM_FREE_GB=25.0
system_free_gb = 25.0

[node]

# Purpose: Directory where this machine keeps its state (repair receipts): the node, or
#          the workstation that drives a node over ssh
# Type: string; an absolute path on the machine running the tool ("", a relative path
#       and a leading ~ are refused; on Windows a path needs its drive, C:\...)
# Default: /var/lib/pve-winrepair on POSIX, %LOCALAPPDATA%\pve-winrepair on Windows
#          (per OS, so not set here)
# Environment Variable: PVE_WINREPAIR___NODE__STATE_DIR=/var/lib/pve-winrepair
# Note: a non-root Linux or macOS workstation cannot create /var/lib/pve-winrepair; set it
#       there, e.g. state_dir = "/home/op/.local/state/pve-winrepair"
# state_dir = "/var/lib/pve-winrepair"

# Purpose: The PVE node to drive over ssh; empty means this machine is the node
# Type: string; a DNS name or IPv4 address: letters, digits, . and -, a letter or digit
#       first and last, up to 253 characters (no _, which DNS host names never hold)
# Default: ""
# Environment Variable: PVE_WINREPAIR___NODE__HOST=pve1
host = ""

# Purpose: Account this machine logs in as on the node
# Type: string; letters, digits and _ . - only, 1 to 64 characters, not starting with -
# Default: "root"
# Environment Variable: PVE_WINREPAIR___NODE__SSH_USER=root
ssh_user = "root"

# Purpose: Private key file this machine logs in to the node with
# Type: string (path); a leading ~ is passed to ssh as written, and ssh expands it;
#       " and % are refused (no quoting carries them through the jump to a guest)
# Default: "" (not configured)
# Environment Variable: PVE_WINREPAIR___NODE__SSH_KEY=~/.ssh/id_pve_node
# Note: not [ssh] key - that is the key for the guests; the node needs its own
ssh_key = ""

# Purpose: The known_hosts file the remote node's host key is checked against (strictly)
# Type: string; a path as ssh takes it (a leading ~ is expanded by ssh); empty,
#       whitespace, " and % are refused (the jump to a guest would expand a % twice)
# Default: "~/.ssh/known_hosts"
# Environment Variable: PVE_WINREPAIR___NODE__KNOWN_HOSTS_FILE=~/.ssh/known_hosts_nodes
known_hosts_file = "~/.ssh/known_hosts"
